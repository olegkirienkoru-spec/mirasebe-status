<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="robots" content="noindex"/>
  <title>Мира — временно недоступна</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0c0b0a;
      --fg: #f2ebe3;
      --muted: color-mix(in oklab, var(--fg) 55%, transparent);
      --accent: #c4a574;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, color-mix(in oklab, var(--accent) 18%, transparent), transparent),
        var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 3rem;
      text-align: center;
    }
    .brand {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 300;
      font-size: clamp(3.5rem, 14vw, 5.5rem);
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, #e8d5b5, var(--accent) 45%, #8a7349);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin: 0 0 1.25rem;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 400;
      font-size: clamp(1.35rem, 4.5vw, 1.75rem);
      line-height: 1.35;
    }
    p {
      margin: 0;
      max-width: 26rem;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.55;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: color-mix(in oklab, var(--fg) 35%, transparent);
    }
  </style>
</head>
<body>
  <main>
    <p class="brand" aria-label="Мира">Мира</p>
    <h1>Временно недоступна</h1>
    <p>
      У хостинг-провайдера авария — сервер Миры сейчас не отвечает.
      Мы следим за восстановлением и скоро вернёмся.
    </p>
    <p class="note">Это временная страница. Приложение заработает, как только хостинг оживёт.</p>
  </main>
</body>
</html>
